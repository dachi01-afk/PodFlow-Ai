{% extends "base.html" %}

{% block title %}Create Channel{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <h1 class="text-3xl font-bold mb-6">Create New Channel</h1>
    
    <form hx-post="/api/channels" 
          hx-swap="none"
          hx-on::after-request="if(event.detail.successful) window.location='/'"
          class="bg-gray-800 p-6 rounded-lg space-y-4">
        
        <div>
            <label class="block text-gray-400 mb-2">Channel Name *</label>
            <input type="text" name="name" required
                   placeholder="Contoh: PodFlow Finance"
                   class="w-full bg-gray-700 rounded px-4 py-2 focus:ring-2 focus:ring-purple-500">
        </div>
        
        <div>
            <label class="block text-gray-400 mb-2">Niche</label>
            <input type="text" name="niche"
                   placeholder="Contoh: Finance, Technology, Health"
                   class="w-full bg-gray-700 rounded px-4 py-2 focus:ring-2 focus:ring-purple-500">
        </div>
        
        <div>
            <label class="block text-gray-400 mb-2">Description</label>
            <textarea name="description" rows="3"
                      placeholder="Deskripsi singkat tentang channel ini..."
                      class="w-full bg-gray-700 rounded px-4 py-2 focus:ring-2 focus:ring-purple-500"></textarea>
        </div>
        
        <button type="submit" 
                class="w-full bg-purple-600 hover:bg-purple-700 py-3 rounded font-bold">
            🎙️ Create Channel
        </button>
    </form>
</div>
{% endblock %}
