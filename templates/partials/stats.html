<div class="grid grid-cols-4 gap-4 mb-6">
    <div class="bg-gray-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-purple-400">{{ total }}</div>
        <div class="text-gray-400">Total Episodes</div>
    </div>
    <div class="bg-gray-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-green-400">{{ completed }}</div>
        <div class="text-gray-400">Completed</div>
    </div>
    <div class="bg-gray-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-yellow-400">{{ processing }}</div>
        <div class="text-gray-400">Processing</div>
    </div>
    <div class="bg-gray-800 p-4 rounded-lg">
        <div class="text-2xl font-bold text-red-400">{{ failed }}</div>
        <div class="text-gray-400">Failed</div>
    </div>
</div>
