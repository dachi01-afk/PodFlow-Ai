research_task:
  description: "Research the topic '{topic}' and extract key insights, trending angles, and sentiment analysis. Focus on Indonesian market context."
  expected_output: "JSON with topic, key_facts, sentiment, trending_angles, sources"
  agent: researcher

script_task:
  description: "Write a podcast script based on the research data. Create dialogue between Host A (formal) and Host B (casual). Include emotions and pause durations."
  expected_output: "JSON with title, description, duration_estimate, dialogue array"
  agent: script_writer
  context:
    - research_task

audio_task:
  description: "Convert the podcast script dialogue to audio file using TTS. Merge all segments into final MP3."
  expected_output: "Path to generated audio file"
  agent: audio_producer
  context:
    - script_task

metadata_task:
  description: "Generate SEO-optimized metadata and social media content from the script and research data."
  expected_output: "JSON with metadata and social content files"
  agent: seo_specialist
  context:
    - script_task
    - research_task
